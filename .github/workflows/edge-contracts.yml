name: Edge configuration and source contracts

on:
  push:
    paths:
      - 'edge_speckle/**'
      - '.gitattributes'
      - '.github/workflows/edge-contracts.yml'
  pull_request:
    paths:
      - 'edge_speckle/**'
      - '.gitattributes'
      - '.github/workflows/edge-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge_speckle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Check configuration, dtype and output-coordinate contracts
        run: python -m unittest discover -s tests -v
      - name: Verify reviewed source bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          manifest = json.loads(Path('docs/release_manifest.json').read_text())
          bad = [name for name, expected in manifest['files_sha256'].items()
                 if hashlib.sha256(Path(name).read_bytes()).hexdigest() != expected]
          if bad:
              raise SystemExit('Source hash mismatch: ' + ', '.join(bad))
          print('Verified', len(manifest['files_sha256']), 'reviewed files')
          PY
